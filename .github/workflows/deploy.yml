name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Capture each product page for README
        shell: bash
        run: |
          mkdir -p dist/readme-images
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tea-mate-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save playwright
          npx playwright install chromium
          node scripts/capture-readme.mjs
          test "$(find dist/readme-images -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Save screenshots as a separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: dist/readme-images/*.png
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

